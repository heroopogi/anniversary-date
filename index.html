<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5ebda">
  <title>For Khai · Our anniversary</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; color: #432e2c; background: #f5ebda; font: 1.05rem/1.6 Georgia, serif }
    main { min-height: 100svh; display: grid; place-items: center; padding: 2rem 1rem; overflow: clip }
    article, .envelope { grid-area: 1 / 1 }
    article { width: min(100%, 33rem); border: 1px solid #a98f77; outline: 1px solid #bda58d; outline-offset: -7px; padding: clamp(1.4rem,5vw,3rem); text-align: center; background: #fff8ea; box-shadow: 0 1rem 3rem #643b261a }
    .envelope { position: relative; isolation: isolate; z-index: 1; width: min(100%, 32rem); aspect-ratio: 1.65; border: 1px solid #ba8c6a; border-radius: 4px; padding: 0; background: #ceaa85; box-shadow: 0 1rem 2rem #754d3530; cursor: pointer; perspective: 70rem; color: #683542; font-family: Georgia, serif }
    .envelope:focus-visible { outline: 3px solid #813846; outline-offset: 6px }
    .pocket, .flap { position: absolute; inset: 0; pointer-events: none }
    .pocket { background: linear-gradient(32deg, #e1be99 49.7%, transparent 50%) left / 51% 100% no-repeat, linear-gradient(-32deg, #e5c6a5 49.7%, transparent 50%) right / 51% 100% no-repeat, #edd5b7; clip-path: polygon(0 0,50% 51%,100% 0,100% 100%,0 100%) }
    .flap { background: linear-gradient(#f7e4c9, #dbb48e); clip-path: polygon(0 0,100% 0,50% 55%); transform-origin: top }
    .seal { position: absolute; top: 51%; left: 50%; transform: translate(-50%,-50%); width: 2.8rem; line-height: 2.8rem; border-radius: 50%; background: #893c49; color: #ffe0c1; box-shadow: inset 0 0 0 3px #a4525b, 0 3px 5px #69452f44; font-size: 1.3rem }
    .address { position: absolute; top: 65%; inset-inline: 0; font-size: clamp(1.3rem,5vw,2rem); font-style: italic }
    .hint { display: block; font: .65rem/2 system-ui,sans-serif; text-transform: uppercase; letter-spacing: .17em }
    .opening .flap { transform: rotateX(173deg); transition: transform .65s ease-in-out }
    .opening .seal, .opening .address { opacity: 0; transition: opacity .22s }
    .opening .envelope { pointer-events: none; animation: lower 1.6s both }
    .opening article { animation: reveal 1.6s both }
    @keyframes lower { 0%, 40% { transform: translateY(0); opacity: 1 } 80%, 100% { transform: translateY(65%); opacity: 0 } }
    @keyframes reveal { 0%, 32% { transform: translateY(12%) scale(.84); clip-path: inset(50% 0); opacity: 0 } 64% { transform: translateY(-5%) scale(.96); opacity: 1 } 100% { transform: none; clip-path: inset(-10%); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .opening article, .opening .envelope { animation-duration: .01s }
      .opening .flap, .opening .seal, .opening .address { transition: none }
    }
    h1 { margin: .4rem 0 1rem; font-weight: normal; font-size: clamp(3rem,9vw,5.7rem); line-height: .96; letter-spacing: -.065em }
    h1 em { color: #913e4a }
    section { max-width: 24rem; margin: 2rem auto }
    h2 { color: #813846; font-size: 1.5rem; font-weight: normal; margin-bottom: .6rem }
    ol { list-style: none; padding: 0; margin: 0; text-align: left }
    li { display: grid; grid-template-columns: 5rem 1fr; align-items: baseline; gap: .6rem; padding: .55rem 0; border-bottom: 1px dotted #b99a80 }
    li time { color: #813846; font: 600 .85rem/1.5 system-ui,sans-serif; font-variant-numeric: tabular-nums }
    .music { width: 100%; max-width: 24rem; min-height: 200px; aspect-ratio: 16 / 9; border: 0; border-radius: 4px }
  </style>
</head>
<body>
  <main>
    <button class="envelope" aria-label="Open Khai’s anniversary invitation" aria-controls="invitation" aria-expanded="false">
      <span class="pocket"></span><span class="flap"></span>
      <span class="seal" aria-hidden="true">♥</span>
      <span class="address">For Khai<span class="hint">Tap to open</span></span>
    </button>
    <article id="invitation" hidden>
    <h1 tabindex="-1">It’s a date,<br><em>Khai.</em></h1>
    <section aria-labelledby="date">
      <h2 id="date"><time datetime="2026-11-05">November 5, 2026</time></h2>
      <ol aria-label="Our anniversary itinerary">
        <li><time datetime="09:00">9:00 AM</time><span>I’ll come to your house</span></li>
        <li><time datetime="10:00">10:00 AM</time><span>Maria Cucina Familia</span></li>
        <li><time datetime="11:30">11:30 AM</time><span>The Ruins</span></li>
        <li><time datetime="12:30">12:30 PM</time><span>Ayala Photo Booth</span></li>
        <li><time datetime="13:30">1:30 PM</time><span>Home Sweet Home</span></li>
      </ol>
    </section>
    <iframe class="music" title="Here With Me — instrumental by Rockstar Beats" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </article></main>
  <script>
    const envelope = document.querySelector('.envelope');
    const invitation = document.querySelector('#invitation');
    envelope.addEventListener('click', () => {
      invitation.hidden = false;
      invitation.querySelector('.music').src = 'https://www.youtube.com/embed/qWnW10PDccI?autoplay=1&playsinline=1';
      envelope.setAttribute('aria-expanded', 'true');
      envelope.parentElement.classList.add('opening');
      invitation.querySelector('h1').focus({ preventScroll: true });
      envelope.addEventListener('animationend', () => envelope.hidden = true, { once: true });
    }, { once: true });
  </script>
</body>
</html>
